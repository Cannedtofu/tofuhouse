name: Gaode Data Auto Run

on:
  schedule:
    # 每天北京时间 09:00 运行 (UTC 01:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许在 GitHub 页面手动触发任务

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 授予 GitHub Action 写入仓库的权限，用于保存 Excel 更改
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd GAODE  
          pip install -r requirements.txt

      - name: Run GAODE Script
        env:
          # 需在 GitHub Repo Settings -> Secrets -> Actions 中配置 EMAIL_PASS
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # 切换到脚本所在目录执行
          cd GAODE
          python GAODE.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 确保路径指向 GAODE 文件夹下的 Excel
          git add GAODE/GaoDe.xlsx
          
          # 检查是否有文件更改，避免无更改时提交报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated update: GaoDe.xlsx $(date +'%Y-%m-%d %H:%M')"
            git push
          else
            echo "No changes to commit"
          fi