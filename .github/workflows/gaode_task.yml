name: Gaode Data Auto Run

on:
  schedule:
    # 每天北京时间 09:00 运行 (UTC 01:00)
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许手动触发测试

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    
    # 授予 GitHub Action 写入仓库的权限，用于保存 Excel 更改
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip' # 缓存依赖以加快后续运行速度

      - name: Install Chrome Browser
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run GAODE Script
        env:
          # 此处对应您代码中的 os.getenv('EMAIL_PASS')
          # 需在 GitHub Repo Settings -> Secrets 中配置 EMAIL_PASS
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          # 切换到脚本目录执行，以确保相对路径有效
          cd GAODE
          python GAODE.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 仅添加子目录下的 Excel 文件
          git add GAODE/GaoDe.xlsx
          # 检查是否有更改，如有则提交
          git commit -m "Automated update: GaoDe.xlsx $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push