<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}News Feed{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .source-header { font-size: 1.05rem; font-weight: 600; border-left: 4px solid #0d6efd; padding-left: .6rem; margin: 1.5rem 0 .75rem; }
    .article-title a { color: #212529; text-decoration: none; font-weight: 500; }
    .article-title a:hover { color: #0d6efd; }
    .article-meta { font-size: .78rem; color: #6c757d; }
    .summary-text { color: #495057; font-size: .92rem; }
    #fetch-btn { min-width: 130px; }
    #fetch-spinner { display: none; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">📰 News Feed</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Feed</a>
        <a class="nav-link {% if request.path == '/sources' %}active{% endif %}" href="/sources">Sources</a>
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
