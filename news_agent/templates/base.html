<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}News Feed{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; letter-spacing: -0.5px; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .source-header { font-size: 1.05rem; font-weight: 600; border-left: 4px solid #0d6efd; padding-left: .6rem; margin: 1.5rem 0 .75rem; }
    .article-title a { color: #212529; text-decoration: none; font-weight: 500; }
    .article-title a:hover { color: #0d6efd; }
    .article-meta { font-size: .78rem; color: #6c757d; }
    .summary-text { color: #495057; font-size: .92rem; }
    #fetch-btn { min-width: 130px; }
    #fetch-spinner { display: none; }
    /* Article body rendered as Markdown */
    #detail-body img { max-width: 100%; height: auto; border-radius: 4px; margin: .75rem 0; }
    #detail-body h1, #detail-body h2, #detail-body h3 { margin-top: 1.25rem; font-size: 1.1rem; font-weight: 600; }
    #detail-body p { margin-bottom: .75rem; }
    #detail-body pre { background: #f1f3f5; padding: .75rem; border-radius: 4px; overflow-x: auto; font-size: .82rem; }
    #detail-body code { background: #f1f3f5; padding: .1rem .3rem; border-radius: 3px; font-size: .85rem; }
    #detail-body blockquote { border-left: 3px solid #dee2e6; padding-left: 1rem; color: #6c757d; }
    #detail-body a { color: #0d6efd; }
    .source-group-header[aria-expanded="true"] .source-chevron { transform: rotate(180deg); }
    .source-group-header:hover { background: #e9ecef !important; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="/">📰 News Feed</a>
      <div class="navbar-nav ms-auto d-flex align-items-center">
        {% if g.current_user %}
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Feed</a>
          <a class="nav-link {% if request.path == '/sources' %}active{% endif %}" href="/sources">Sources</a>
          <a class="nav-link {% if request.path == '/logs' %}active{% endif %}" href="/logs">Logs</a>
          <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">Settings</a>
          <span class="navbar-text text-muted small ms-3 me-2">{{ g.current_user.email }}</span>
          <form method="post" action="/logout" class="d-inline mb-0">
            <button type="submit" class="btn btn-sm btn-outline-light">Logout</button>
          </form>
        {% else %}
          <a class="nav-link" href="/identify">Sign In</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container pb-5">
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
