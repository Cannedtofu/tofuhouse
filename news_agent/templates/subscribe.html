{% extends "base.html" %}
{% block title %}订阅设置{% endblock %}

{% block content %}
<script id="digest-presets-data" type="application/json">{{ digest_presets | tojson }}</script>
<script id="all-sources-data"   type="application/json">{{ all_sources   | tojson }}</script>

<div class="row justify-content-center">
  <div class="col-lg-8 col-xl-7">
    <h5 class="mb-1">📧 邮件简报订阅</h5>
    <p class="text-muted small mb-4">简报将发送至 <strong>{{ g.current_user.email }}</strong>，每 6 小时检查一次发送条件。</p>
    <div id="subscribe-body"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let DIGEST_PRESETS = JSON.parse(document.getElementById('digest-presets-data').textContent);
const ALL_SOURCES  = JSON.parse(document.getElementById('all-sources-data').textContent);

function _escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setAllChecks(cls, checked) {
  document.querySelectorAll(`.${cls}`).forEach(cb => cb.checked = checked);
}

function render() {
  const container = document.getElementById('subscribe-body');
  const freqLabel = v => ({1:'每天', 3:'每 3 天', 7:'每周', 14:'每 2 周'}[v] || `每 ${v} 天`);

  const SOURCE_GROUPS = [
    { label: '推特',       types: ['nitter'] },
    { label: 'RSS / 网站', types: ['rss', 'web'] },
    { label: 'YouTube',    types: ['youtube'] },
  ];

  function buildSourceChecks(checkedIds, idPrefix) {
    let html = '';
    SOURCE_GROUPS.forEach(({ label, types }) => {
      const group = ALL_SOURCES.filter(s => types.includes(s.type));
      if (!group.length) return;
      html += `<div class="mb-1 mt-2 text-muted fw-semibold" style="font-size:.72rem;letter-spacing:.04em">${label}</div>`;
      html += '<div class="row row-cols-2 row-cols-md-3 g-1">';
      group.forEach(s => {
        const chk = checkedIds.includes(s.id) ? 'checked' : '';
        html += `<div class="col"><div class="form-check">
          <input type="checkbox" class="form-check-input ${idPrefix}-src" id="${idPrefix}-${s.id}" value="${s.id}" ${chk}>
          <label class="form-check-label small" for="${idPrefix}-${s.id}">${_escHtml(s.name)}</label>
        </div></div>`;
      });
      html += '</div>';
    });
    return html;
  }

  let html = '';
  for (let slot = 0; slot < 2; slot++) {
    const p = DIGEST_PRESETS[slot];
    if (slot > 0) html += '<hr class="my-4">';

    if (p) {
      const freqOpts = [1,3,7,14].map(v =>
        `<option value="${v}"${p.digest_frequency_days===v?' selected':''}>${freqLabel(v)}</option>`
      ).join('');
      html += `
        <div class="preset-edit-block mb-2" data-preset-id="${p.id}">
          <div class="d-flex align-items-center gap-2 mb-3">
            <span class="text-muted small flex-shrink-0 fw-semibold">简报 ${slot+1}</span>
            <input type="text" class="form-control form-control-sm flex-grow-1"
                   id="preset-name-${p.id}" value="${_escHtml(p.name)}" placeholder="简报名称">
          </div>
          <div class="d-flex gap-1 mb-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setAllChecks('pedit-${p.id}-src', true)">全选</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setAllChecks('pedit-${p.id}-src', false)">取消全选</button>
          </div>
          ${buildSourceChecks(p.source_ids, `pedit-${p.id}`)}
          <div class="d-flex align-items-center gap-2 flex-wrap mt-3">
            <div class="form-check form-switch mb-0">
              <input type="checkbox" class="form-check-input" id="pemail-${p.id}"
                     ${p.digest_enabled ? 'checked' : ''}>
              <label class="form-check-label small" for="pemail-${p.id}">邮件发送</label>
            </div>
            <select class="form-select form-select-sm w-auto" id="pfreq-${p.id}">${freqOpts}</select>
            <button class="btn btn-sm btn-primary" onclick="saveEditPreset(${p.id})">保存</button>
          </div>
        </div>`;
    } else {
      html += `
        <div id="new-preset-block-${slot}">
          <div class="d-flex align-items-center mb-3 gap-2">
            <span class="text-muted small flex-shrink-0 fw-semibold">简报 ${slot+1}</span>
            <input type="text" class="form-control form-control-sm flex-grow-1"
                   id="new-preset-name-${slot}" placeholder="简报名称（例：科技资讯）">
            <button class="btn btn-sm btn-primary" onclick="saveNewPreset(${slot})">保存配置</button>
          </div>
          <div class="d-flex gap-1 mb-2">
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setAllChecks('pnew-${slot}-src', true)">全选</button>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="setAllChecks('pnew-${slot}-src', false)">取消全选</button>
          </div>
          ${buildSourceChecks([], `pnew-${slot}`)}
        </div>`;
    }
  }
  container.innerHTML = html;
}

function saveNewPreset(slot) {
  const nameEl = document.getElementById(`new-preset-name-${slot}`);
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const sourceIds = Array.from(document.querySelectorAll(`.pnew-${slot}-src:checked`))
    .map(el => parseInt(el.value));
  fetch('/digest/presets', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, source_ids: sourceIds })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { alert(data.error); return; }
    DIGEST_PRESETS.push(data);
    render();
  })
  .catch(() => alert('保存失败'));
}

function saveEditPreset(id) {
  const nameEl = document.getElementById(`preset-name-${id}`);
  const name = nameEl.value.trim();
  if (!name) { nameEl.focus(); return; }
  const block = document.querySelector(`.preset-edit-block[data-preset-id="${id}"]`);
  const sourceIds = Array.from(block.querySelectorAll(`.pedit-${id}-src:checked`))
    .map(el => parseInt(el.value));
  const digest_enabled = document.getElementById(`pemail-${id}`).checked;
  const digest_frequency_days = parseInt(document.getElementById(`pfreq-${id}`).value);
  fetch(`/digest/presets/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, source_ids: sourceIds, digest_enabled, digest_frequency_days })
  })
  .then(r => r.json())
  .then(data => {
    if (data.error) { alert(data.error); return; }
    const idx = DIGEST_PRESETS.findIndex(p => p.id === id);
    if (idx !== -1) DIGEST_PRESETS[idx] = { ...DIGEST_PRESETS[idx], name, source_ids: sourceIds, digest_enabled, digest_frequency_days };
    const btn = block.querySelector('button.btn-primary');
    if (btn) { const orig = btn.textContent; btn.textContent = '✓ 已保存'; setTimeout(() => { btn.textContent = orig; }, 1500); }
  })
  .catch(() => alert('保存失败'));
}

render();
</script>
{% endblock %}
